name: CI

on:
  push:
    branches: [main, development]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features

  windows:
    name: Windows (compile + unit tests)
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features

  live-smoke:
    name: Live smoke (fresh IRIS)
    needs: lint
    runs-on: ubuntu-latest
    services:
      iris:
        image: intersystemsdc/iris-community:2025.3
        ports:
          - 1972:1972
          - 52773:52773
        env:
          IRIS_USERNAME: _SYSTEM
          IRIS_PASSWORD: SYS
        options: >-
          --health-cmd "iris session IRIS -U %SYS '##class(%SYSTEM.Process).GetOS()' || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 90s
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Set _SYSTEM password (image env handling unreliable on this tag)
        run: |
          for i in $(seq 1 30); do
            if docker inspect "$(docker ps -q --filter ancestor=intersystemsdc/iris-community:2025.3)" --format '{{.State.Health.Status}}' 2>/dev/null | grep -q healthy; then break; fi
            sleep 5
          done
          docker exec "$(docker ps -q --filter ancestor=intersystemsdc/iris-community:2025.3)" \
            iris session IRIS -U%SYS <<-'EOSESS'
          set sc = ##class(Security.Users).Exists("_SYSTEM", .user)
          if $isobject(user) { set user.PasswordExternal = "SYS", sc = user.%Save() }
          halt
          EOSESS
      - name: Live protocol tests
        run: cargo test -- --ignored --test-threads=1
        env:
          IRISHOST: 127.0.0.1
          IRISPORT: "1972"
          IRISUSER: _SYSTEM
          IRISPASSWORD: SYS
          IRISNS: USER

  release:
    name: Release
    needs: [test, windows, live-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Job-level so the publish step's `if: env.…` can read it (step-level env
    # is not visible to the same step's condition).
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Changelog (git-cliff)
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip tags
        env:
          GITHUB_REPO: ${{ github.repository }}
      - name: Package gate (contents + license present)
        run: |
          cargo package --allow-dirty --list
          cargo package --allow-dirty
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.cliff.outputs.changelog }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: target/package/irisnative-*.crate
      # crates.io publish only once a registry token is configured; until
      # then GitHub releases carry the .crate file.
      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
