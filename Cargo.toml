[package]
name = "irisnative"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Rust client scaffold for InterSystems IRIS over the native Superserver wire protocol (TCP 1972) — API surface for globals, SQL and class-method calls, no vendor SDK. Pre-release: wire layer not yet implemented."
license = "MIT"
repository = "https://github.com/AdriaERNI/rust-irisnative"
readme = "README.md"
include = ["/src/", "/examples/", "/tests/", "/LICENSE", "/README.md", "/rustfmt.toml"]
keywords = ["iris", "intersystems", "superserver", "database", "objectscript"]
categories = ["database", "api-bindings"]

[features]
default = []
# Planned async connection (tokio runtime supplied by the consumer).
# Gates no code yet — enabling it changes nothing until the wire layer lands.
async = ["dep:tokio"]

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "rt"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
